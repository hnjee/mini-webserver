# PR에서 문서(.md)가 바뀌면 테크니컬 라이팅 원칙으로 검수함
name: Claude 문서 검수

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**/*.md"

concurrency:
  group: claude-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            너는 테크니컬 라이팅 검수자임. 코드는 보지 말고 이 PR에서 바뀐 .md 파일만 검수해.
            1. `docs/technical-writing-principles.md`를 먼저 읽어. 이게 유일한 기준임.
            2. `gh pr diff`로 바뀐 .md 파일과 줄을 확인해.
            3. 세 관점으로 각각 검수해.
               - 구조: 한 문서 한 주제, 가치 먼저, 제목 단계, 링크 경로
               - 문장·용어: 해요체, 한 문장 한 내용, 용어 통일, 맞춤법·띄어쓰기
               - 정확성: 코드·명령어·옵션이 저장소 실제 내용과 맞는지, 문서끼리 모순
            4. 각 지적을 스스로 다시 검증해서, 근거가 약하면 버려.
            5. 남은 지적은 해당 줄에 인라인 코멘트로 남겨
               (위치 / 문제 / 근거(원칙 번호) / 수정안 / 심각도 🔴🟡🟢).
            6. 마지막에 `gh pr comment`로 요약 1개를 남겨. 문서는 직접 고치지 마.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
